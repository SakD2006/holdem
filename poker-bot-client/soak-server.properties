# Server settings for a bot soak run: no waiting between hands or during run-outs, so hundreds of
# hands take seconds. Start the server with these instead of server.properties:
#
#   ./mvnw -pl poker-server -am -DskipTests package cargo:run -Dholdem.config=poker-bot-client/soak-server.properties
#
# The database settings are the defaults, matching docker-compose.yml.
hand.delay.ms=0
runout.pause.ms=0
bot.think.min.ms=0
bot.think.max.ms=0
