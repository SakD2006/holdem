# Local development database only. Tests tagged "db" run against it.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: holdem
      POSTGRES_USER: holdem
      POSTGRES_PASSWORD: holdem
    ports:
      - "5433:5432"
    volumes:
      - holdem-pg:/var/lib/postgresql/data
volumes:
  holdem-pg:
